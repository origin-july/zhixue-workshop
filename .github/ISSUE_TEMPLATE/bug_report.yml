name: Bug 反馈
description: 报告一个可以复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        复现步骤写得越具体，修得越快。缺信息的话得来回问一轮。

  - type: textarea
    id: what-happened
    attributes:
      label: 实际发生了什么
      description: 描述你看到的异常现象
      placeholder: 点「交卷」后页面空白，成绩没写进看板
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你期望什么
      placeholder: 应该跳到成绩页，看板状态变成「已完成」
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开页面开始，一步一行
      placeholder: |
        1. 打开 index.html，用 admin / admin2026 登录
        2. 进入「信息安全与合规」培训
        3. 点「开始考核」，答完 9 题
        4. 点右上角「交卷」
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 浏览器与版本
      description: 手机端布局问题请注明设备型号
      placeholder: Chrome 131 / Windows 11，或 iPhone 15 Safari
    validations:
      required: true

  - type: input
    id: viewport
    attributes:
      label: 屏幕宽度
      description: 布局问题必填。可以按 F12 看，或直接写手机型号
      placeholder: 1440px / 390px

  - type: dropdown
    id: role
    attributes:
      label: 出问题时的身份
      options:
        - 管理员
        - 学员
        - 登录页（还没登录）
        - 不确定
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: 截图
      description: 直接把图片拖进这个框。界面问题几乎都需要
      placeholder: 拖入图片

  - type: textarea
    id: console
    attributes:
      label: 控制台报错
      description: 按 F12 → Console，把红色报错贴进来。没有就留空
      render: shell
