name: 功能建议
description: 提一个你想解决的问题
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        说清「你想解决什么问题」，比说「你想要什么功能」更有用。
        前者我能想出三种实现方式，后者我得猜你为什么需要它。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题
      description: 具体的场景，不要抽象
      placeholder: |
        每月导出成绩时要手动补「部门负责人」这一列，
        40 多人得一个一个查，容易填错。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想怎么解决
      description: 有想法就写，没有就留空。这一步不是必须的
      placeholder: 员工库加一个「直属上级」字段，导出时带上

  - type: textarea
    id: alternatives
    attributes:
      label: 你现在是怎么绕过去的
      description: 了解现状，才知道这个需求有多痛
      placeholder: 导完 CSV 再用 VLOOKUP 匹配

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 所有用户都会用到
        - 只有管理员用
        - 只有学员会看到
        - 只在某个尺寸 / 浏览器下
    validations:
      required: true
